\* MBCheckIR.cfg --- TLC configuration for bounded-model checking of P1..P8
\*
\* Run:
\*   java -cp /path/to/tla2tools.jar tlc2.TLC \
\*        -config MBCheckIR.cfg MBCheckIR.tla
\*
\* The bounds below give a state space of ~10^5 reachable states which TLC
\* enumerates in under a minute on commodity hardware.  Increase MaxEvents
\* to widen the coverage (state space grows roughly as MaxEvents! * 6^MaxEvents).

SPECIFICATION Spec

CONSTANTS
    MaxEvents  = 4
    MaxObjects = 2
    Threads    = { "P0", "P1" }

INVARIANTS
    TypeOK
    Inv

\* Per-property invariants -- enable one at a time to localise violations.
\*    P1_PO_Embedding
\*    P2_AnchorFidelity
\*    P3_RfClosure
\*    P4_NoSpuriousHbAdd
\*    P5_NoSpuriousHbRemove
\*    P6_AliasFaithful
\*    P7_ExistsClause
\*    P8_Conservative

CHECK_DEADLOCK FALSE
